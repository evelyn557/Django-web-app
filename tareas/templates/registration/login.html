{% extends 'base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h2 class="mb-3 text-center">Iniciar sesión</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-2">Ingresar</button>
            </form>

            <p class="text-center mt-3">
                ¿No tienes cuenta? <a href="{% url 'registro' %}">Crear cuenta</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
