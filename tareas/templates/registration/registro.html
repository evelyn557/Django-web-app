{% extends 'base.html' %}

{% block title %}Registro{% endblock %}

{% block content %}
<style>
    .errorlist, ul.errorlist li, .helptext ul {
        color: #dc3545; /* Rojo estilo Bootstrap (danger) */
    }
</style>
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="mb-3 text-center">Crear cuenta</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-2">Registrarse</button>
            </form>
            
            <p class="text-center mt-3">
                ¿Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
